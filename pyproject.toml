[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textbook-knowledge-builder"
version = "0.1.0"
description = "LLM-powered pipeline for converting textbooks into structured educational knowledge."
requires-python = ">=3.11"

dependencies = [
    "PyMuPDF>=1.24,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]